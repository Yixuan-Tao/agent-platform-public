[tool:pytest]
# 测试发现规则
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记定义
markers =
    slow: 标记为慢速测试（> 1s）
    integration: 需要外部服务的集成测试
    unit: 纯单元测试
    real_api: 需要真实 LLM API 调用（默认跳过，设置 --run-real-api 启用）
