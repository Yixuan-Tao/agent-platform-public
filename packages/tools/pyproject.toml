[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-tools"
version = "0.1.0"
description = "agent-platform 统一工具契约 + MCP + 插件沙箱"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "beautifulsoup4>=4.12.0",
  "feedparser>=6.0.0",
  "pydantic>=2.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_platform.tools*"]
