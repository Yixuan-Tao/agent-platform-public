[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-core"
version = "0.1.0"
description = "agent-platform 工程底座：配置/数据库/LLM 路由/日志/schema"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.30.0",
  "openai>=1.60.0",
  "tenacity>=9.0.0",
  "loguru>=0.7.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_platform.core*"]
